<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Footprint Lite</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Global Header -->
        <div style="text-align: center; margin: 1.5rem 0;">
            <img src="https://raw.githubusercontent.com/Rossy0109/Money_Tracker/main/logo.png" alt="Money Footprint Logo" style="width: 120px; height: 120px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); object-fit: cover;">
            <h2 style="margin-top: 0.5rem; color: var(--primary); font-family: 'Hind Siliguri', sans-serif;">Money Footprint</h2>
        </div>

        <!-- Auth Section -->
        <div id="auth-section" class="card auth-card">
            <h2 id="auth-title" data-i18n="auth.login">Login</h2>
            <div id="github-login-container" style="margin-bottom: 1.5rem;">
                <button id="github-login-btn" style="background: #24292e; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;">
                    <svg height="20" width="20" viewBox="0 0 16 16" fill="white"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
                    <span data-i18n="auth.github">Login with GitHub</span>
                </button>
            </div>
            <div style="display: flex; align-items: center; margin-bottom: 1rem; color: var(--text-muted);">
                <hr style="flex: 1; border: 0.5px solid var(--border);">
                <span style="margin: 0 10px; font-size: 0.8rem;" data-i18n="auth.or">OR EMAIL</span>
                <hr style="flex: 1; border: 0.5px solid var(--border);">
            </div>
            <form id="auth-form">
                <input type="email" id="email" data-i18n-placeholder="auth.email" placeholder="Email" required>
                <input type="password" id="password" data-i18n-placeholder="auth.password" placeholder="Password" required>
                <button type="submit" id="submit-btn" data-i18n="auth.login">Login</button>
            </form>
            <p style="margin-top: 1rem;">
                <span id="toggle-auth" class="text-link" data-i18n="auth.signup_link">Don't have an account? Sign Up</span>
            </p>
        </div>

        <!-- Main App Section -->
        <div id="app-section" class="hidden">
            <div class="nav-tabs" style="overflow-x: auto; white-space: nowrap;">
                <div class="tab active" data-tab="dashboard" data-i18n="nav.dashboard">Dashboard</div>
                <div class="tab" data-tab="add" data-i18n="nav.add">Add</div>
                <div class="tab" data-tab="accounting" data-i18n="nav.accounting">Accounting</div>
                <div class="tab" data-tab="reports" data-i18n="nav.reports">Reports</div>
                <div class="tab" data-tab="lab" data-i18n="nav.lab">Lab</div>
                <div class="tab" data-tab="settings" data-i18n="nav.settings">Settings</div>
                <div id="logout-btn" class="tab" style="color: var(--expense)" data-i18n="nav.logout">Logout</div>
            </div>

            <!-- Dashboard Tab -->
            <div id="tab-dashboard">
                <div style="margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label style="font-size: 0.8rem; font-weight: 600;" data-i18n="dash.view_period">View Period:</label>
                        <input type="month" id="dashboard-month" style="width: auto; margin: 0; padding: 0.5rem; font-size: 0.8rem;">
                    </div>
                    <button id="lang-toggle-btn" style="padding: 4px 12px; font-size: 0.75rem; background: #e2e8f0; border-radius: 5px;">EN / বাংলা</button>
                </div>
                
                <div class="summary-grid">
                    <div class="card summary-card balance-card">
                        <small data-i18n="dash.balance">Total Balance</small>
                        <h1 id="total-balance">৳0.00</h1>
                    </div>
                </div>

                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h3 data-i18n="dash.recent">Recent Transactions</h3>
                        <input type="text" id="tx-search" data-i18n-placeholder="dash.search" placeholder="Search..." style="width: 100px; padding: 4px; font-size: 0.8rem;">
                    </div>
                    <div id="transaction-list"></div>
                </div>
            </div>
            <!-- ... other sections same ... -->
        </div>
        <!-- Footer -->
        <footer style="text-align: center; margin: 2rem 0; color: var(--text-muted); font-size: 0.8rem;">
            &copy; <span id="current-year"></span> | <strong>Kamrul Ahmed</strong>
        </footer>
    </div>
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
        document.getElementById('current-year').innerText = new Date().getFullYear();
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
