<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Footprint Lite</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div class="app-container">
        <div style="text-align: center; margin: 1.5rem 0;">
            <img src="logo.png" alt="Money Footprint Logo" style="width: 120px; height: 120px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); object-fit: cover;">
            <h2 style="margin-top: 0.5rem; color: var(--primary); font-family: 'Hind Siliguri', sans-serif;">Money Footprint</h2>
        </div>

        <div id="auth-section" class="card auth-card">
            <h2 id="auth-title" data-i18n="auth.login">Login</h2>
            <div style="margin-bottom: 1.5rem;">
                <button id="github-login-btn" style="background: #24292e; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;">Login with GitHub</button>
            </div>
            <form id="auth-form">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" id="submit-btn">Login</button>
            </form>
        </div>

        <div id="app-section" class="hidden">
            <div class="nav-tabs" style="overflow-x: auto; white-space: nowrap;">
                <div class="tab active" data-tab="dashboard">Dashboard</div>
                <div class="tab" data-tab="add">Add</div>
                <div class="tab" data-tab="accounting">Accounting</div>
                <div class="tab" data-tab="reports">Reports</div>
                <div class="tab" data-tab="settings">Settings</div>
                <div id="logout-btn" class="tab" style="color: var(--expense)">Logout</div>
            </div>

            <!-- Dashboard -->
            <div id="tab-dashboard">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <input type="month" id="dashboard-month">
                    <button id="lang-toggle-btn" style="padding: 5px 10px; font-size: 0.7rem;">EN / বাংলা</button>
                </div>
                <div class="summary-grid">
                    <div class="card balance-card">
                        <small>Balance</small>
                        <h1 id="total-balance">৳0.00</h1>
                    </div>
                </div>
                <div class="card">
                    <input type="text" id="tx-search" placeholder="Search transactions...">
                    <div id="transaction-list"></div>
                </div>
            </div>

            <!-- Add/Accounting/Reports/Settings remain same but with enhanced UI -->
            <div id="tab-add" class="hidden">...</div>
            <div id="tab-accounting" class="hidden">...</div>
            <div id="tab-reports" class="hidden">
                <button id="csv-btn">Export Excel (CSV)</button>
            </div>
            <div id="tab-settings" class="hidden">...</div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
