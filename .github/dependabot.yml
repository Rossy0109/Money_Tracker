version: 2

updates:
  # ── npm dependencies ────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Dhaka

    # Never open more than 5 PRs at once — avoid PR fatigue.
    open-pull-requests-limit: 5

    # Group patch + minor updates into a single PR per batch.
    # Major updates always get their own PR for careful review.
    groups:
      patch-and-minor:
        update-types:
          - patch
          - minor
        # Exclude critical packages from the group — they must be reviewed individually.
        exclude-patterns:
          - "cookie"
          - "express"
          - "react"
          - "react-dom"
          - "vite"
          - "vitest"
          - "react-day-picker"
          - "react-resizable-panels"
          - "tailwindcss"
          - "typescript"
          - "drizzle-orm"
          - "drizzle-kit"
          - "esbuild"
          - "zod"
          - "helmet"
          - "jose"
          - "pino"
          - "pino-http"
          - "react-hook-form"
          - "@hookform/resolvers"
          - "@trpc/server"
          - "@trpc/client"
          - "@trpc/react-query"

    # TypeScript 7 is a native-compiler major that typescript-eslint does not
    # support yet (verify job fails with "does not support TS 7.0"). Hold the
    # major so the rest of the group stays mergeable; minors still flow.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

    # Critical packages listed in `exclude-patterns` above are kept out of the
    # batch so each gets its own PR for careful review. Merging is governed by
    # branch protection (no Dependabot auto-merge); Dependabot has no
    # "require manual review" key. (A previous `rules:`/`package-name:` block
    # here was not valid Dependabot schema and has been removed.)

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  # ── Docker ──────────────────────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
