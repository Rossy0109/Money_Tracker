name: Test and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # - name: Run E2E tests
      #   run: npm test

      - name: Inject Build Version
        run: |
          VERSION=$(date +%Y.%m.%d.%H%M)
          sed -i "s/{{BUILD_VERSION}}/$VERSION/g" sw.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Use custom GH_PAT if provided (e.g. for protected branches), otherwise fallback to standard GITHUB_TOKEN
          github_token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          exclude_assets: '.git,.github,Money_Tracker,client,server,desktop,docker-compose.yml,render.yaml,vercel.json,supabase_schema.sql,tests,playwright.config.js,node_modules,package-lock.json'
