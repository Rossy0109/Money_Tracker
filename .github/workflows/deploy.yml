name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Build Version
        run: |
          VERSION=$(date +%Y.%m.%d.%H%M)
          sed -i "s/{{BUILD_VERSION}}/$VERSION/g" sw.js

      - name: Prepare Distribution
        run: |
          mkdir dist
          # Copy only the files needed for the Ultimate PWA
          cp index.html app.js style.css manifest.json locales.js firebase-config.js sw.js dist/
          # Copy any other assets if they exist in root (like icons)
          # check for .png files in root
          cp *.png dist/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_sw_update: true
