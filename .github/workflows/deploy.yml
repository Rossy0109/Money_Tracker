name: Production Deployment (10-Year Sustainability)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install dependencies (Root)
        run: npm install
      - name: Install dependencies (React Client)
        run: cd Foot_Print_of_Money/client && npm install
      - name: Install dependencies (Python Server)
        run: cd Foot_Print_of_Money/server && pip install -r requirements.txt
      
      # Inject Dummy Secrets for Testing to prevent app crash
      - name: Inject Dummy Secrets for Testing
        run: |
          sed -i "s|__FIREBASE_API_KEY__|AIzaDummyKey|g" firebase-config.js
          sed -i "s|__FIREBASE_AUTH_DOMAIN__|dummy.firebaseapp.com|g" firebase-config.js
          sed -i "s|__FIREBASE_PROJECT_ID__|dummy-project|g" firebase-config.js
          sed -i "s|__FIREBASE_STORAGE_BUCKET__|dummy.appspot.com|g" firebase-config.js
          sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|123456789|g" firebase-config.js
          sed -i "s|__FIREBASE_APP_ID__|1:123:web:abc|g" firebase-config.js
          sed -i "s|__ADMIN_EMAIL__|test@example.com|g" firebase-config.js
          sed -i "s|__SUPABASE_URL__|https://dummy.supabase.co|g" data-hub.js
          sed -i "s|__SUPABASE_KEY__|dummy-key|g" data-hub.js

      - name: Run Playwright tests
        run: |
          npx playwright install --with-deps
          npm test

  deploy-frontend-vercel:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      
      # Replace placeholders in root app
      - name: Inject Secrets into Root App
        run: |
          sed -i "s|__FIREBASE_API_KEY__|${{ secrets.FIREBASE_API_KEY }}|g" firebase-config.js
          sed -i "s|__FIREBASE_AUTH_DOMAIN__|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" firebase-config.js
          sed -i "s|__FIREBASE_PROJECT_ID__|${{ secrets.FIREBASE_PROJECT_ID }}|g" firebase-config.js
          sed -i "s|__FIREBASE_STORAGE_BUCKET__|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" firebase-config.js
          sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" firebase-config.js
          sed -i "s|__FIREBASE_APP_ID__|${{ secrets.FIREBASE_APP_ID }}|g" firebase-config.js
          sed -i "s|__ADMIN_EMAIL__|${{ secrets.ADMIN_EMAIL }}|g" firebase-config.js
          sed -i "s|__SUPABASE_URL__|${{ secrets.SUPABASE_URL }}|g" data-hub.js
          sed -i "s|__SUPABASE_KEY__|${{ secrets.SUPABASE_KEY }}|g" data-hub.js

      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Project Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-backend-render:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-root-firebase:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
