name: Verify dependency bumps

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-dependencies:
    name: Install, type check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADMIN_ACCESS_PASSWORD: ci-dependency-bump-admin-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        # persist-credentials stays at its default (true) for this one job: the
        # policy gate runs `git fetch origin <base>` below, which needs the
        # checkout token. Every other workflow here only reads the tree, so they
        # set persist-credentials: false.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # pnpm/action-setup@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
      - name: Check dependency policy (no majors without approval)
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref || 'main' }}"
          node scripts/check-dependency-policy.mjs \
            --base "origin/${{ github.base_ref || 'main' }}" \
            --head HEAD
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test
