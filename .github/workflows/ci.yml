name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_MODE: google
  VITE_AUTH_MODE: google
  GOOGLE_OAUTH_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
  GOOGLE_OAUTH_CLIENT_SECRET: ci-placeholder-secret
  GOOGLE_OAUTH_REDIRECT_URI: http://localhost:3000/api/auth/google/callback
  SESSION_SECRET: ci-test-session-secret-minimum-32-characters
  JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long
  ADMIN_BOOTSTRAP_EMAIL: admin@example.com
  ADMIN_ACCESS_PASSWORD: ci-test-admin-access-password

jobs:
  # ── Gate 1: Install + Typecheck + Lint + Build ──────────────────────────────
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  # ── Gate 2: Unit tests (accounting, security, RBAC, idempotency, audit …) ──
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: NODE_ENV=test pnpm vitest run

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ── Gate 3: Isolated server E2E (MariaDB service, throwaway DB) ─────────────
  e2e:
    runs-on: ubuntu-latest
    needs: [verify]
    services:
      mariadb:
        image: mariadb:10.11
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: money_tracker
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Server E2E tests
        env:
          ISOLATED_E2E_DATABASE_URL: mysql://root:password@127.0.0.1:3306/money_tracker
        run: NODE_ENV=test npx vitest run --config vitest.e2e.config.ts

  # ── Gate 4: Browser E2E (MariaDB + Playwright + dev server) ─────────────────
  browser-e2e:
    runs-on: ubuntu-latest
    needs: [verify]
    services:
      mariadb:
        image: mariadb:10.11
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: money_tracker
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Browser E2E tests
        env:
          ISOLATED_E2E_DATABASE_URL: mysql://root:password@127.0.0.1:3306/money_tracker
        run: NODE_ENV=test pnpm vitest run --config vitest.e2e.config.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
