name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOOGLE_OAUTH_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
  GOOGLE_OAUTH_CLIENT_SECRET: ci-placeholder-secret
  GOOGLE_OAUTH_REDIRECT_URI: http://localhost:3000/api/auth/google/callback
  SESSION_SECRET: ci-test-session-secret-minimum-32-characters
  JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long
  ADMIN_BOOTSTRAP_EMAIL: admin@example.com
  ADMIN_ACCESS_PASSWORD: ci-test-admin-access-password

jobs:
  # ── Gate 1: Install + Typecheck + Lint + Build ──────────────────────────────
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_MODE: google
      VITE_AUTH_MODE: google
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # pnpm/action-setup@v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      # Enforce the workflow-hardening posture (SHA pins, timeouts,
      # persist-credentials) so a future edit cannot regress it.
      - name: Workflow hardening gate
        run: node scripts/check-workflow-hardening.mjs

      - name: Build
        run: pnpm build

  # ── Gate 2: Unit tests (accounting, security, RBAC, idempotency, audit …) ──
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # pnpm/action-setup@v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ── Gate 2b: Worker runtime tests (Hono shim, tRPC fetch, R2/KV wiring) ────
  worker:
    runs-on: ubuntu-latest
    needs: [verify]
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:10.11
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: money_tracker
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      ISOLATED_E2E_DATABASE_URL: mysql://root:password@127.0.0.1:3306/money_tracker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # pnpm/action-setup@v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The MariaDB service starts empty; worker login/auth tests need schema.
      - name: Apply database schema
        run: node scripts/reconcile-migrations.mjs --url "$ISOLATED_E2E_DATABASE_URL"

      - name: Worker tests
        run: pnpm test:worker

      - name: Worker bundle (wrangler dry-run)
        # wrangler needs dist/public for the [assets] binding
        run: |
          pnpm build
          pnpm build:worker

  # ── Gate 3: Isolated server E2E (MariaDB service, throwaway DB) ─────────────
  e2e:
    runs-on: ubuntu-latest
    needs: [verify]
    timeout-minutes: 40
    services:
      mariadb:
        image: mariadb:10.11
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: money_tracker
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # pnpm/action-setup@v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migration rehearsal
        env:
          ISOLATED_E2E_DATABASE_URL: mysql://root:password@127.0.0.1:3306/money_tracker
        run: pnpm test:migrations

      # Hermetic db.ts suite (disposable scratch DBs) — self-skips in the
      # `test` job because no database is reachable there, so run it here
      # where MariaDB is already provisioned.
      - name: Hermetic DB unit suite
        env:
          ISOLATED_E2E_DATABASE_URL: mysql://root:password@127.0.0.1:3306/money_tracker
        run: pnpm exec vitest run server/db.hermetic.test.ts

      - name: Server E2E tests
        env:
          ISOLATED_E2E_DATABASE_URL: mysql://root:password@127.0.0.1:3306/money_tracker
        run: pnpm test:e2e:isolated

  # ── Gate 4: Browser E2E (MariaDB + Playwright + dev server) ─────────────────
  browser-e2e:
    runs-on: ubuntu-latest
    needs: [verify]
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:10.11
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: money_tracker
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # pnpm/action-setup@v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Browser E2E tests
        env:
          ISOLATED_E2E_DATABASE_URL: mysql://root:password@127.0.0.1:3306/money_tracker
        run: NODE_ENV=test pnpm test:browser:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
