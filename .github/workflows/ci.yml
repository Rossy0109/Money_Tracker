name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: cd Foot_Print_of_Money && npm install
      - name: Install Playwright Browsers
        run: cd Foot_Print_of_Money && npx playwright install --with-deps
      - name: Run Playwright tests
        run: cd Foot_Print_of_Money && npm test
