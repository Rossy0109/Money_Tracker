name: Daily Automated Finance Backup

on:
  schedule:
    # Runs at 18:00 UTC (00:00 AM Bangladesh Standard Time) every day
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-finance-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Trigger Scheduled Encrypted Backup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Root cause of the silent 2026-09 failures: the Supabase storage bucket
      # did not exist, so every upload got "Bucket not found" and the server
      # recorded success:false without throwing — an HTTP 200 lie. Verify the
      # destination exists (and create it if the admin key allows) BEFORE
      # triggering, so a missing bucket fails loudly with a clear message.
      - name: Ensure Supabase backup bucket exists
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_ADMIN_KEY: ${{ secrets.SUPABASE_KEY }}
          BUCKET: amar-hisab-backups
        run: |
          set -euo pipefail
          if [ -z "$SB_URL" ] || [ -z "$SB_ADMIN_KEY" ]; then
            echo "SUPABASE_URL and SUPABASE_KEY GitHub secrets are required to verify the backup bucket."
            exit 1
          fi
          BASE="$(printf '%s' "$SB_URL" | tr -d '\r\n')"

          buckets=$(curl -s --max-time 20 "$BASE/storage/v1/bucket" \
            -H "apikey: $SB_ADMIN_KEY" -H "Authorization: Bearer $SB_ADMIN_KEY")
          if echo "$buckets" | jq -e --arg b "$BUCKET" '.[] | select(.name == $b)' >/dev/null 2>&1; then
            echo "Bucket '$BUCKET' exists — destination ready."
            exit 0
          fi

          echo "Bucket '$BUCKET' missing. Supabase said: $(printf '%.300s' "$buckets")"
          code=$(curl -s -o create_out.json -w "%{http_code}" --max-time 20 \
            -X POST "$BASE/storage/v1/bucket" \
            -H "apikey: $SB_ADMIN_KEY" -H "Authorization: Bearer $SB_ADMIN_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"$BUCKET\",\"name\":\"$BUCKET\",\"public\":false,\"fileSizeLimit\":\"52428800\"}")
          echo "Create response ($code): $(cat create_out.json)"
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "Bucket creation failed — SUPABASE_KEY is likely not a service-role/admin key."
            echo "Create the bucket in the Supabase dashboard (Storage → New bucket → name: $BUCKET),"
            echo "or store a service-role key as the SUPABASE_KEY GitHub secret."
            exit 1
          fi
          echo "Bucket '$BUCKET' created."

      - name: Trigger Remote Backup Endpoint
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://money-tracker-blond-pi.vercel.app' }}
          # Preferred secret: CRON_SECRET (matches server hasValidCronSecret).
          # BACKUP_CRON_SECRET is accepted as a legacy alias by the server.
          # ADMIN_ACCESS_PASSWORD must never authorize backups.
          BACKUP_SECRET: ${{ secrets.CRON_SECRET || secrets.BACKUP_CRON_SECRET }}
        run: |
          if [ -z "$BACKUP_SECRET" ]; then
            echo "Failing loudly: CRON_SECRET (or BACKUP_CRON_SECRET) secret not set on GitHub."
            echo "A silently-skipped backup is worse than a red job — set the secret to re-enable."
            exit 1
          fi

          TARGET_URL="${APP_URL%/}/api/scheduled/finance-backup"
          echo "Triggering backup at: $TARGET_URL (GET — same method as Vercel Cron)"

          # Vercel Cron always uses GET; use GET here too so GitHub and Vercel
          # exercise the identical production path. The Express route is
          # registered with app.all, so POST remains accepted as well.
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X GET "$TARGET_URL" \
            -H "Authorization: Bearer $BACKUP_SECRET")

          cat response.json
          echo ""

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Backup trigger failed with status code $HTTP_CODE"
            exit 1
          fi

          echo "Automated daily backup endpoint returned 200."

      # HTTP 200 alone never proved storage: uploads that fail are counted,
      # not thrown. The endpoint now reports counts and answers 500 when any
      # project failed — assert them here so a hollow 200 cannot pass.
      - name: Assert backup result counts
        run: |
          echo "Response payload: $(jq -c '{success, projects, stored, verified, failed}' response.json)"
          if ! jq -e '.success == true
                      and (.projects // 0) >= 1
                      and .stored == .projects
                      and .verified == .projects
                      and (.failed // 1) == 0' response.json > /dev/null; then
            echo "Backup response did not report a complete success:"
            jq . response.json
            exit 1
          fi
          echo "Counts confirmed: every project stored and verified."

      # Ground truth: the audit row is written from inside the backup run and
      # `cloud_backup` is only recorded when every upload succeeded and the
      # integrity re-export matched. This catches silent storage failures the
      # HTTP status and even the response body cannot.
      #
      # Read through the cron-protected API rather than connecting to the
      # production database from GitHub: a prod DB credential in Actions is a
      # far bigger blast radius than the cron secret, and it silently rots
      # whenever the DB password rotates (it already had).
      - name: Verify backup audit trail
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://money-tracker-blond-pi.vercel.app' }}
          BACKUP_SECRET: ${{ secrets.CRON_SECRET || secrets.BACKUP_CRON_SECRET }}
          VERIFY_WINDOW_MINUTES: "30"
        run: |
          if [ -z "$BACKUP_SECRET" ]; then
            echo "Failing loudly: CRON_SECRET (or BACKUP_CRON_SECRET) secret not set on GitHub."
            exit 1
          fi

          AUDIT_URL="${APP_URL%/}/api/scheduled/backup-audit?windowMinutes=$VERIFY_WINDOW_MINUTES"
          HTTP_CODE=$(curl -s -o audit.json -w "%{http_code}" -X GET "$AUDIT_URL" \
            -H "Authorization: Bearer $BACKUP_SECRET")

          cat audit.json
          echo ""

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Audit read failed with status code $HTTP_CODE"
            exit 1
          fi

          if ! jq -e '.verified == true' audit.json > /dev/null; then
            echo "Backup audit trail did not prove storage + integrity:"
            jq '{verified, reason, audit}' audit.json
            exit 1
          fi

          echo "OK: audit row #$(jq -r '.audit.id' audit.json) proves storage + integrity — $(jq -r '.audit.summary' audit.json)"

      # Retention runs last, so objects are only ever removed after this run's
      # backup has been proven stored and verified. Without this the bucket grows
      # without bound. Selection is floor-guarded (see
      # scripts/lib/backup-retention.mjs): only `*-backup-YYYY-MM-DD-*.enc.json`
      # names are eligible and each project keeps its newest 7 regardless of age.
      - name: Prune expired backups
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BACKUP_RETENTION_DAYS: "90"
          BACKUP_KEEP_PER_PROJECT: "7"
        run: node scripts/prune-backups.mjs --apply
