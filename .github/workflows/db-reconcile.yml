name: DB Schema Reconcile (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run prints the plan without writing; apply executes it"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply
      confirm:
        description: "Required only for apply: type APPLY-TO-PROD to confirm"
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: db-schema-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile production schema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run schema reconciliation
        # Production-only credentials: use the purpose-built secret. The
        # generic `DATABASE_URL` Actions secret is a legacy PostgreSQL URL and
        # must never shadow the TiDB/MariaDB production URL (see F-7).
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "PROD_DATABASE_URL secret is not set on GitHub (repo Settings → Secrets → Actions)."
            echo "Copy it from Vercel project Settings → Environment Variables → DATABASE_URL (Production)."
            echo "Never paste database credentials into code, logs, or chat."
            exit 1
          fi
          if [ "${{ inputs.mode }}" = "apply" ]; then
            if [ "${{ inputs.confirm }}" != "APPLY-TO-PROD" ]; then
              echo "Refusing to apply: type APPLY-TO-PROD in the confirm field."
              exit 1
            fi
            node scripts/reconcile-migrations.mjs
          else
            node scripts/reconcile-migrations.mjs --dry-run
          fi
