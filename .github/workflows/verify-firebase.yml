name: Firebase Configuration Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Check Firebase Config File
        run: |
          if [ ! -f "firebase-config.js" ]; then
            echo "Error: firebase-config.js missing!"
            exit 1
          fi

      - name: Validate Secret Placeholders
        run: |
          grep -q "NEXT_PUBLIC_FIREBASE_API_KEY" firebase-config.js || { echo "Missing API Key placeholder"; exit 1; }
          grep -q "NEXT_PUBLIC_FIREBASE_PROJECT_ID" firebase-config.js || { echo "Missing Project ID placeholder"; exit 1; }

      - name: Verify Analytics Integration
        run: |
          if [ ! -f "firebase-plus.js" ]; then
            echo "Error: firebase-plus.js missing!"
            exit 1
          fi
          grep -q "getAnalytics" firebase-plus.js || { echo "Analytics SDK not imported"; exit 1; }

      - name: Verify Messaging Integration
        run: |
          grep -q "getMessaging" firebase-plus.js || { echo "Messaging SDK not imported"; exit 1; }
