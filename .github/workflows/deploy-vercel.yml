name: Deploy to Vercel (CD)

# Deploy only the exact commit CI validated. Previously this triggered on
# `push: main` alongside CI on the same event, so production could ship a
# commit whose typecheck/lint/unit/e2e/browser gates were still running or about
# to fail. `workflow_run` fires after CI settles, and the checkout pins the
# validated SHA so a fast follow-up push cannot shift what is deployed.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-cd
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    timeout-minutes: 20
    # Manual dispatch always runs. A CI completion only deploys when every gate
    # passed and the validated commit is on the production branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Deploy with Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning title=CD inactive::VERCEL_TOKEN secret is not set. Add VERCEL_TOKEN (and optionally VERCEL_ORG_ID / VERCEL_PROJECT_ID) to enable deploy-on-green-CI for main."
            exit 0
          fi

          # The CLI version is pinned in package.json devDependencies (single
          # source of truth, shared with local dev), so install it from the
          # lockfile instead of a floating global. Dependabot keeps it in step.
          pnpm install --frozen-lockfile

          # Project-scoped (vcp_) tokens cannot read project settings, so the
          # deploy flow needs a regular account access token here.
          if ! pnpm exec vercel whoami --token="$VERCEL_TOKEN" >/dev/null 2>&1; then
            echo "::error title=Invalid VERCEL_TOKEN::Vercel rejected the token. Use a regular account access token (vercel.com/account/settings/tokens), not a project-scoped token."
            exit 1
          fi

          pnpm exec vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm exec vercel build --prod --token="$VERCEL_TOKEN"
          pnpm exec vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
