name: Deploy GitHub Pages app redirect

on:
  push:
    branches: [main]
    paths:
      - pages-redirect/**
      - .github/workflows/deploy-pages-redirect.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Upload redirect artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy redirect to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
