name = "money-tracker"
main = "worker/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/public"
not_found_handling = "single-page-application"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "6393cfa66822415fa69319105dc0efa5"

[[r2_buckets]]
bucket_name = "money-tracker-storage"
binding = "R2_BUCKET"

[triggers]
crons = ["0 18 * * *", "0 1 * * *"]

[vars]
AUTH_MODE = "google"
VITE_AUTH_MODE = "google"
APP_URL = "https://money-tracker.kamrul01.workers.dev"
NODE_ENV = "production"
BACKUP_RETENTION_DAYS = "30"
