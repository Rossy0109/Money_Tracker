<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173f36" />
    <title>অফলাইন — আমার হিসাব</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7faf7; color: #173f36; font-family: "Noto Sans Bengali", sans-serif; }
      main { max-width: 30rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
      p { line-height: 1.7; color: #365b4b; }
    </style>
  </head>
  <body>
    <main>
      <h1>ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না</h1>
      <p>সংযোগ ফিরে এলে আবার চেষ্টা করুন। আপনার ব্যক্তিগত আর্থিক তথ্য এই অফলাইন পৃষ্ঠায় দেখানো হয় না।</p>
    </main>
  </body>
</html>
