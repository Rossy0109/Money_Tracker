<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#173f36" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ahmed's Financial Accounting" />
    <title>Ahmed's Financial Accounting</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preload" href="/fonts/NotoSansBengali-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/NotoSansBengali-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/NotoSansBengali-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Noto Sans Bengali';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/NotoSansBengali-Regular.woff2') format('woff2');
        unicode-range: U+0980-09FE, U+200C-200D, U+25CC;
      }
      @font-face {
        font-family: 'Noto Sans Bengali';
        font-style: normal;
        font-weight: 500 600;
        font-display: swap;
        src: url('/fonts/NotoSansBengali-SemiBold.woff2') format('woff2');
        unicode-range: U+0980-09FE, U+200C-200D, U+25CC;
      }
      @font-face {
        font-family: 'Noto Sans Bengali';
        font-style: normal;
        font-weight: 700 800;
        font-display: swap;
        src: url('/fonts/NotoSansBengali-Bold.woff2') format('woff2');
        unicode-range: U+0980-09FE, U+200C-200D, U+25CC;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (endpoint && websiteId && !endpoint.startsWith("%") && !websiteId.startsWith("%")) {
          var s = document.createElement("script");
          s.defer = true;
          s.src = endpoint + "/umami";
          s.setAttribute("data-website-id", websiteId);
          document.body.appendChild(s);
        }
      })();
    </script>
  </body>
</html>
